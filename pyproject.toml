[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "kindle-notes-pdf-notion"
version = "0.1.0"
description = "Generate Japanese-ready PDFs from exported Kindle notes and optionally sync them to Notion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kindle-notes-pdf-notion contributors" }]
keywords = ["kindle", "highlights", "notion", "pdf", "reading-notes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-beautifulsoup4>=4.12,<5",
]

[project.scripts]
kindle-notes = "kindle_notes_pdf_notion.cli:app"

[project.urls]
Repository = "https://github.com/univcorp2-ctrl/kindle-notes-pdf-notion"
Issues = "https://github.com/univcorp2-ctrl/kindle-notes-pdf-notion/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kindle_notes_pdf_notion"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=kindle_notes_pdf_notion --cov-report=term-missing"
testpaths = ["tests"]
